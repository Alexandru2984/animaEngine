title = 'animaEngine — animowane postacie na twoim pulpicie'
description = 'Animowane postacie, które mieszkają na twoim pulpicie: chodzą, skaczą, chodzą za sobą, coś mówią i przypominają o przerwach. Linux i Windows. Bez sieci, otwarty kod.'
nav_features = 'Funkcje'
