p_title = 'Prywatność — animaEngine'
p_description = 'animaEngine niczego nie zbiera: aplikacja nie łączy się z siecią.'
home = 'Strona główna'
p_intro = '<strong>Aplikacja niczego nie zbiera.</strong> animaEngine nie łączy się z siecią w żaden sposób: bez telemetrii, bez wysyłania raportów o awariach, bez sprawdzania aktualizacji, bez kont, bez reklam. Nic o tobie, twoim komputerze ani o tym, co masz na ekranie, go nie opuszcza.'
p_keeps = 'Co aplikacja przechowuje na twoim komputerze'
p_keeps1 = 'Swoje ustawienia i twoje sceny, w folderze konfiguracji twojego użytkownika (<code>~/.config/animaengine</code> w Linuksie, <code>%APPDATA%\animaEngine</code> w Windows).'
p_keeps2 = 'Obrazki, które dodajesz, w swojej bibliotece, oraz ich zdekodowane kopie w folderze pamięci podręcznej, żeby wczytywały się szybciej.'
p_keeps3 = 'Po awarii kopię sceny sprzed niej, dla <code>anima-engine --recover</code>.'
p_keeps_after = 'Wszystko zostaje na twoim komputerze, w folderach twojego użytkownika. Odinstalowanie zostawia je na potem; usuń te foldery, żeby je skasować. <a href="https://github.com/Alexandru2984/animaEngine/blob/main/docs/faq.md#removing-it">Najczęstsze pytania</a> mówią, gdzie są.'
p_report = 'Raport diagnostyczny'
p_report_text = 'Wygląd → O programie → <em>Kopiuj raport diagnostyczny</em> umieszcza krótki tekst w schowku: wersję aplikacji, nazwę twojego systemu, twoją kartę graficzną i ostatnie ostrzeżenia aplikacji — nigdy ścieżki twoich plików. Aplikacja nigdzie go nie wysyła. Trafia tylko tam, gdzie go wkleisz.'
p_site = 'Ta strona'
p_site_text = 'Ta strona nie zapisuje ciasteczek, nie uruchamia statystyk ani skryptów i nie wczytuje niczego z innych stron. Udostępnia ją GitHub Pages, który jak każdy serwer WWW otrzymuje twój adres IP przy każdym żądaniu; zobacz <a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement">oświadczenie o prywatności GitHub</a>. Pliki do pobrania pochodzą ze stron wydań GitHub, na tych samych zasadach.'
p_contact = 'Kontakt'
p_contact_text = 'Pytania o prywatność: <a href="https://github.com/Alexandru2984/animaEngine/issues">zgłoś problem</a> albo, w sprawie bezpieczeństwa, postępuj według <a href="https://github.com/Alexandru2984/animaEngine/blob/main/SECURITY.md">zasad bezpieczeństwa</a>.'
