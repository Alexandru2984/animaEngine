h1 = 'Animowane postacie, które mieszkają na twoim pulpicie'
lead = 'Chodzą, skaczą, chodzą za sobą i bawią się w berka nad twoimi oknami — albo pod nimi. Dotknij jednej, a się przywita. Kliknięcia trafiają prosto do twojej pracy.'
view_source = 'Zobacz kod'
demo_alt = 'Postać zostaje dotknięta i się wita; otwiera się tryb edycji, jedna postać zostaje zaznaczona, a wklejony obrazek staje się nową postacią.'

features = 'Co potrafi'
card1_h = 'Każdy obrazek ożywa'
card1 = 'Upuść na ekran PNG, GIF, WebP albo krótkie MP4 lub wklej obrazek: staje się postacią.'
card2_h = 'Własne życie'
card2 = 'Chodzenie, wędrowanie, skakanie, chodzenie za kursorem albo za sobą nawzajem, zabawa w berka — albo mały skrypt, który napiszesz.'
card3_h = 'Przez cały dzień'
card3 = 'Przypomnienia o przerwie albo o piciu wody, minutnik skupienia, pora snu i „witaj z powrotem”, kiedy wracasz.'
card4_h = 'Nie przeszkadzają'
card4 = 'Kliknięcia przez nie przechodzą. Usuwają się na bok przy grach i filmach na pełnym ekranie i nie ruszają się, gdy cię nie ma.'
card5_h = 'Sceny do dzielenia się'
card5 = 'Zapisz to, co jest na ekranie, pod nazwą, zmieniaj sceny zależnie od pory dnia i udostępnij scenę albo postać jako jeden plik.'
card6_h = 'Lekki'
card6 = 'Prawie zero procesora, gdy nic się nie rusza, trzydzieści klatek na sekundę, jeśli chcesz, a na laptopie z Linuksem karta NVIDIA dalej śpi.'
card7_h = 'Dla każdego'
card7 = 'Dziesięć języków, czytniki ekranu, każda czynność z klawiatury, motywy o wysokim kontraście.'
card8_h = 'Prywatny z założenia'
card8 = 'Nie łączy się z siecią w ogóle. Nic o tobie ani o twoim pulpicie nie opuszcza twojego komputera.'

