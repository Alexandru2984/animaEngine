demo_alt = 'Um personagem é tocado e diz olá; o modo de edição abre, um personagem é selecionado e uma imagem colada vira um personagem novo.'

features = 'O que ele faz'
card1_h = 'Qualquer imagem ganha vida'
card1 = 'Solte na tela um PNG, um GIF, um WebP ou um MP4 curto, ou cole uma imagem: ela vira um personagem.'
card2_h = 'Uma vida própria'
card2 = 'Andar, passear, quicar, seguir o cursor ou uns aos outros, brincar de pega-pega — ou um pequeno script escrito por você.'
card3_h = 'Ao longo do seu dia'
card3 = 'Lembretes para fazer uma pausa ou beber água, um temporizador de foco, a hora de dormir e um “bem-vindo de volta” quando você retorna.'
card4_h = 'Sem atrapalhar'
card4 = 'Os cliques passam através deles. Eles saem da frente de jogos e filmes em tela cheia e ficam parados enquanto você está fora.'
card5_h = 'Cenas para compartilhar'
card5 = 'Salve o que está na tela com um nome, troque conforme a hora do dia e compartilhe uma cena ou um personagem em um único arquivo.'
card6_h = 'Leve'
card6 = 'Quase nenhum processador enquanto nada se move, trinta quadros por segundo se você quiser, e num notebook com Linux a GPU NVIDIA continua dormindo.'
card7_h = 'Para todos'
card7 = 'Dez idiomas, leitores de tela, toda ação pelo teclado, temas de alto contraste.'
card8_h = 'Privado por natureza'
card8 = 'Ele não faz nenhuma conexão de rede. Nada sobre você ou sua área de trabalho sai do seu computador.'

