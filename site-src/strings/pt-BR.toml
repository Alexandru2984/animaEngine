p_title = 'Privacidade — animaEngine'
p_description = 'animaEngine não coleta nada: o aplicativo não faz nenhuma conexão de rede.'
home = 'Início'
p_intro = '<strong>O aplicativo não coleta nada.</strong> animaEngine não faz conexão de rede de nenhum tipo: sem telemetria, sem relatórios de falha enviados, sem busca de atualizações, sem contas, sem anúncios. Nada sobre você, seu computador ou o que está na sua tela sai dele.'
p_keeps = 'O que o aplicativo guarda, no seu computador'
p_keeps1 = 'As configurações dele e as suas cenas, na pasta de configuração do seu usuário (<code>~/.config/animaengine</code> no Linux, <code>%APPDATA%\animaEngine</code> no Windows).'
p_keeps2 = 'As imagens que você adiciona, na biblioteca dele, e cópias decodificadas delas numa pasta de cache, para carregarem mais rápido.'
p_keeps3 = 'Depois de uma falha, uma cópia da cena de pouco antes, para <code>anima-engine --recover</code>.'
p_keeps_after = 'Tudo fica no seu computador, nas pastas do seu usuário. A desinstalação mantém tudo para uma instalação futura; apague essas pastas para remover. As <a href="https://github.com/Alexandru2984/animaEngine/blob/main/docs/faq.md#removing-it">perguntas frequentes</a> dizem onde elas estão.'
p_report = 'O relatório de diagnóstico'
p_report_text = 'Aparência → Sobre → <em>Copiar relatório de diagnóstico</em> coloca um texto curto na sua área de transferência: a versão do aplicativo, o nome do seu sistema, sua placa de vídeo e os últimos avisos do aplicativo — nunca os caminhos dos seus arquivos. O aplicativo não o envia a lugar nenhum. Ele vai só para onde você colar.'
p_site = 'Este site'
p_site_text = 'Este site não usa cookies, não executa análises nem scripts e não carrega nada de outros sites. Ele é servido pelo GitHub Pages, que, como qualquer servidor web, recebe seu endereço IP a cada requisição; veja a <a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement">declaração de privacidade do GitHub</a>. Os downloads vêm das páginas de versões do GitHub, sob a mesma declaração.'
p_contact = 'Contato'
p_contact_text = 'Dúvidas sobre privacidade: <a href="https://github.com/Alexandru2984/animaEngine/issues">abra uma issue</a> ou, para um problema de segurança, siga a <a href="https://github.com/Alexandru2984/animaEngine/blob/main/SECURITY.md">política de segurança</a>.'
p_changed = 'Última alteração: 25 de outubro de 2026.'
