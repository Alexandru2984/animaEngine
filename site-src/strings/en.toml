features = 'What it does'
card1_h = 'Any picture comes alive'
card1 = 'Drop a PNG, GIF, WebP or a short MP4 on the screen, or paste a picture: it becomes a character.'
card2_h = 'A life of their own'
card2 = 'Walking, wandering, bouncing, following the cursor or each other, playing tag — or a small script you write.'
card3_h = 'Around your day'
card3 = 'Reminders to take a break or drink water, a focus timer, bedtime, and a welcome back when you return.'
card4_h = 'Out of your way'
card4 = 'Clicks pass through. They step aside for full-screen games and films, and hold still while you are away.'
card5_h = 'Scenes to share'
card5 = 'Save what is on screen under a name, switch by the time of day, and share a scene or a character as one file.'
card6_h = 'Light'
card6 = 'Next to no CPU while nothing moves, thirty frames a second if you like, and on a Linux laptop the NVIDIA GPU left asleep.'
card7_h = 'For everyone'
card7 = 'Ten languages, screen readers, every action from the keyboard, high-contrast themes.'
card8_h = 'Private by design'
card8 = 'It makes no network connection at all. Nothing about you or your desktop leaves your computer.'

