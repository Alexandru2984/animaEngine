p_title = 'Privacy — animaEngine'
p_description = 'animaEngine collects nothing: the app makes no network connection.'
home = 'Home'
p_intro = '<strong>The app collects nothing.</strong> animaEngine makes no network connection of any kind: no telemetry, no crash reporting, no update checks, no accounts, no advertising. Nothing about you, your computer or what is on your screen leaves it.'
p_keeps = 'What the app keeps, on your computer'
p_keeps1 = '''Its settings and your scenes, in your user's configuration folder (<code>~/.config/animaengine</code> on Linux, <code>%APPDATA%\animaEngine</code> on Windows).'''
p_keeps2 = 'The pictures you add, in its asset library, and decoded copies of them in a cache folder, so they load faster.'
p_keeps3 = 'After a crash, a copy of the scene from just before it, for <code>anima-engine --recover</code>.'
p_keeps_after = '''All of it stays on your computer, in your own user's folders. Uninstalling leaves it in place for a later install; delete those folders to remove it. The <a href="https://github.com/Alexandru2984/animaEngine/blob/main/docs/faq.md#removing-it">FAQ</a> says where they are.'''
p_report = 'The diagnostic report'
p_report_text = '''Appearance → About → <em>Copy diagnostic report</em> puts a short text on your clipboard: the app's version, your system's name, your graphics card and the app's latest warnings — never the paths of your files. The app sends it nowhere. It goes only where you paste it.'''
p_site = 'This website'
p_site_text = '''This site sets no cookies and runs no analytics or scripts, and it loads nothing from other sites. It is served by GitHub Pages, which, like any web server, receives your IP address with each request; see <a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement">GitHub's privacy statement</a>. Downloads come from GitHub's release pages, under the same statement.'''
p_contact = 'Contact'
p_contact_text = '''Questions about privacy: <a href="https://github.com/Alexandru2984/animaEngine/issues">open an issue</a>, or, for a security problem, follow the <a href="https://github.com/Alexandru2984/animaEngine/blob/main/SECURITY.md">security policy</a>.'''
