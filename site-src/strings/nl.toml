p_title = 'Privacy — animaEngine'
p_description = 'animaEngine verzamelt niets: de app maakt geen netwerkverbinding.'
home = 'Start'
p_intro = '<strong>De app verzamelt niets.</strong> animaEngine maakt geen enkele netwerkverbinding: geen telemetrie, geen verzonden crashrapporten, geen controle op updates, geen accounts, geen advertenties. Niets over u, uw computer of wat er op uw scherm staat verlaat hem.'
p_keeps = 'Wat de app bewaart, op uw computer'
p_keeps1 = 'Haar instellingen en uw scènes, in de configuratiemap van uw gebruiker (<code>~/.config/animaengine</code> op Linux, <code>%APPDATA%\animaEngine</code> op Windows).'
p_keeps2 = 'De afbeeldingen die u toevoegt, in haar bibliotheek, en gedecodeerde kopieën ervan in een cachemap, zodat ze sneller laden.'
p_keeps3 = 'Na een crash een kopie van de scène van vlak daarvoor, voor <code>anima-engine --recover</code>.'
p_keeps_after = 'Alles blijft op uw computer, in de mappen van uw gebruiker. Bij het verwijderen van de app blijft het staan voor een latere installatie; verwijder die mappen om het te wissen. De <a href="https://github.com/Alexandru2984/animaEngine/blob/main/docs/faq.md#removing-it">veelgestelde vragen</a> zeggen waar ze staan.'
p_report = 'Het diagnoserapport'
p_report_text = 'Weergave → Over → <em>Diagnoserapport kopiëren</em> zet een korte tekst op uw klembord: de versie van de app, de naam van uw systeem, uw videokaart en de laatste waarschuwingen van de app — nooit de paden van uw bestanden. De app verstuurt het nergens heen. Het gaat alleen waar u het plakt.'
p_site = 'Deze website'
p_site_text = 'Deze site plaatst geen cookies, draait geen statistieken of scripts en laadt niets van andere sites. Hij wordt geleverd door GitHub Pages, dat, zoals elke webserver, bij elk verzoek uw IP-adres ontvangt; zie de <a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement">privacyverklaring van GitHub</a>. Downloads komen van de releasepagina’s van GitHub, onder dezelfde verklaring.'
p_contact = 'Contact'
p_contact_text = 'Vragen over privacy: <a href="https://github.com/Alexandru2984/animaEngine/issues">open een issue</a> of volg bij een beveiligingsprobleem het <a href="https://github.com/Alexandru2984/animaEngine/blob/main/SECURITY.md">beveiligingsbeleid</a>.'
p_changed = 'Laatst gewijzigd: 25 oktober 2026.'
