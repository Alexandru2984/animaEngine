h1 = 'Geanimeerde figuren die op uw bureaublad wonen'
lead = 'Ze lopen, stuiteren, volgen elkaar en spelen tikkertje boven uw vensters — of eronder. Tik er een aan en hij zegt hallo. Klikken gaan rechtstreeks naar uw werk.'
view_source = 'Broncode bekijken'
demo_alt = 'Een figuur wordt aangetikt en zegt hallo; de bewerkmodus opent, een figuur wordt geselecteerd en een geplakte afbeelding wordt een nieuwe figuur.'

features = 'Wat het doet'
card1_h = 'Elke afbeelding komt tot leven'
card1 = 'Zet een PNG, GIF, WebP of kort MP4 op het scherm, of plak een afbeelding: het wordt een figuur.'
card2_h = 'Een eigen leven'
card2 = 'Lopen, rondzwerven, stuiteren, de cursor of elkaar volgen, tikkertje spelen — of een klein script dat u zelf schrijft.'
card3_h = 'Door uw dag heen'
card3 = 'Herinneringen om een pauze te nemen of water te drinken, een focustimer, bedtijd en een „welkom terug” als u terugkomt.'
card4_h = 'Nooit in de weg'
card4 = 'Klikken gaan erdoorheen. Ze gaan opzij voor spellen en films op volledig scherm, en houden zich stil terwijl u weg bent.'
card5_h = 'Scènes om te delen'
card5 = 'Bewaar wat op het scherm staat onder een naam, wissel naar het tijdstip van de dag, en deel een scène of een figuur als één bestand.'
card6_h = 'Licht'
card6 = 'Vrijwel geen processor zolang niets beweegt, dertig beelden per seconde als u wilt, en op een Linux-laptop blijft de NVIDIA-GPU slapen.'
card7_h = 'Voor iedereen'
card7 = 'Tien talen, schermlezers, elke actie via het toetsenbord, thema’s met hoog contrast.'
card8_h = 'Privé van opzet'
card8 = 'Het maakt geen enkele netwerkverbinding. Niets over u of uw bureaublad verlaat uw computer.'

look = 'Een kijkje'
trailer = 'Een halve minuut, zonder geluid: figuren die over het bureaublad lopen en zweven; een tik op de kat en op het hart, en elk zegt hallo; het welkom, waarin het konijntje, de kikker, de paddenstoel en de wolk op het bureaublad worden gezet; de kat opgetild, vastgehouden en losgelaten om te vallen.'
shot1_alt = 'Vijf figuren boven een bureaubladachtergrond; de kat zegt „Hi there!”'
shot1 = 'Op het bureaublad, klikken gaan erdoorheen'
shot2_alt = 'De bewerkmodus: de kat geselecteerd, de Inspector toont positie en weergave.'
shot2 = 'Bewerkmodus: schikken en aanpassen'
shot3_alt = 'Het opdrachtenpalet met kant-en-klare scènes.'
shot3 = 'Alles via het toetsenbord'
shot4_alt = 'Het tabblad Weergave: thema, taal, toegankelijkheid, pauzeren en beelden per seconde.'
shot4 = 'Zoals u werkt'

