p_title = 'プライバシー — animaEngine'
p_description = 'animaEngine は何も収集しません。アプリはネットワークに接続しません。'
home = 'ホーム'
p_intro = '<strong>アプリは何も収集しません。</strong>animaEngine はネットワークに一切接続しません。テレメトリーも、クラッシュレポートの送信も、アップデートの確認も、アカウントも、広告もありません。あなたやコンピューター、画面の内容についての情報が外に出ることはありません。'
p_keeps = 'アプリがコンピューターに保存するもの'
p_keeps1 = '設定とシーン。ユーザーの設定フォルダー(Linux では <code>~/.config/animaengine</code>、Windows では <code>%APPDATA%\animaEngine</code>)に保存されます。'
p_keeps2 = '追加した画像はアセットライブラリに、その読み込み済みのコピーはキャッシュフォルダーに保存され、読み込みが速くなります。'
p_keeps3 = 'クラッシュの後には、直前のシーンのコピー(<code>anima-engine --recover</code> 用)。'
p_keeps_after = 'すべてはあなたのコンピューターの、あなたのユーザーのフォルダーに残ります。アンインストールしても再インストールに備えて残るので、消したいときはそれらのフォルダーを削除してください。場所は<a href="https://github.com/Alexandru2984/animaEngine/blob/main/docs/faq.md#removing-it">よくある質問</a>にあります。'
p_report = '診断レポート'
p_report_text = '外観 → このアプリについて → <em>診断レポートをコピー</em> を押すと、短いテキストがクリップボードに入ります。アプリのバージョン、システムの名前、グラフィックカード、アプリの最近の警告で、ファイルのパスは決して含まれません。アプリはこれをどこにも送りません。あなたが貼り付けた場所にだけ届きます。'
p_site = 'このウェブサイト'
p_site_text = 'このサイトは Cookie を使わず、アクセス解析やスクリプトも動かさず、他のサイトから何も読み込みません。配信は GitHub Pages が行い、ほかのウェブサーバーと同じく、リクエストのたびにあなたの IP アドレスを受け取ります。<a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement">GitHub のプライバシーに関する声明</a>をご覧ください。ダウンロードも GitHub のリリースページから、同じ声明のもとで提供されます。'
p_contact = 'お問い合わせ'
p_contact_text = 'プライバシーについての質問は <a href="https://github.com/Alexandru2984/animaEngine/issues">Issue を作成</a>してください。セキュリティの問題は<a href="https://github.com/Alexandru2984/animaEngine/blob/main/SECURITY.md">セキュリティポリシー</a>に従ってください。'
p_changed = '最終更新: 2026 年 10 月 25 日。'
