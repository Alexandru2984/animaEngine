p_title = 'Confidențialitate — animaEngine'
p_description = 'animaEngine nu colectează nimic: aplicația nu face nicio conexiune la rețea.'
home = 'Acasă'
p_intro = '<strong>Aplicația nu colectează nimic.</strong> animaEngine nu face nicio conexiune la rețea, de niciun fel: fără telemetrie, fără rapoarte de crash trimise, fără verificări de actualizări, fără conturi, fără reclame. Nimic despre tine, calculatorul tău sau ce e pe ecran nu-l părăsește.'
p_keeps = 'Ce păstrează aplicația, pe calculatorul tău'
p_keeps1 = 'Setările ei și scenele tale, în dosarul de configurare al utilizatorului tău (<code>~/.config/animaengine</code> pe Linux, <code>%APPDATA%\animaEngine</code> pe Windows).'
p_keeps2 = 'Imaginile pe care le adaugi, în biblioteca ei, și copii decodate ale lor într-un dosar de cache, ca să se încarce mai repede.'
p_keeps3 = 'După un crash, o copie a scenei de dinaintea lui, pentru <code>anima-engine --recover</code>.'
p_keeps_after = 'Toate rămân pe calculatorul tău, în dosarele utilizatorului tău. Dezinstalarea le lasă pe loc pentru o instalare ulterioară; ca să le ștergi, ștergi dosarele acelea. <a href="https://github.com/Alexandru2984/animaEngine/blob/main/docs/faq.md#removing-it">Întrebările frecvente</a> spun unde sunt.'
p_report = 'Raportul de diagnostic'
p_report_text = 'Aspect → Despre → <em>Copiază raportul de diagnostic</em> pune un text scurt în clipboard: versiunea aplicației, numele sistemului tău, placa video și ultimele avertismente ale aplicației — niciodată căile fișierelor tale. Aplicația nu-l trimite nicăieri. Ajunge doar unde îl lipești tu.'
p_site = 'Acest site'
p_site_text = '''Acest site nu pune cookie-uri, nu rulează analize sau scripturi și nu încarcă nimic de pe alte site-uri. E servit de GitHub Pages, care, ca orice server web, primește adresa ta IP la fiecare cerere; vezi <a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement">declarația de confidențialitate a GitHub</a>. Descărcările vin de pe paginile de versiuni ale GitHub, sub aceeași declarație.'''
p_contact = 'Contact'
p_contact_text = 'Întrebări despre confidențialitate: <a href="https://github.com/Alexandru2984/animaEngine/issues">deschide un issue</a> sau, pentru o problemă de securitate, urmează <a href="https://github.com/Alexandru2984/animaEngine/blob/main/SECURITY.md">politica de securitate</a>.'
