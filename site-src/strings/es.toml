shot2 = 'Modo edición: colócalos y cámbialos'
shot3_alt = 'La paleta de comandos con escenas ya preparadas.'
shot3 = 'Todo desde el teclado'
shot4_alt = 'La pestaña Apariencia: tema, idioma, accesibilidad, pausas y fotogramas por segundo.'
shot4 = 'A la medida de cómo trabajas'

