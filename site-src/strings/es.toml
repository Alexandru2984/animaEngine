h1 = 'Personajes animados que viven en tu escritorio'
lead = 'Caminan, rebotan, se siguen y juegan a pillar sobre tus ventanas — o debajo de ellas. Toca uno y te saluda. Los clics pasan directamente a tu trabajo.'
view_source = 'Ver el código'
demo_alt = 'Se toca un personaje y saluda; se abre el modo edición, se selecciona un personaje y una imagen pegada se convierte en un personaje nuevo.'

features = 'Qué hace'
card1_h = 'Cualquier imagen cobra vida'
card1 = 'Suelta en la pantalla un PNG, un GIF, un WebP o un MP4 corto, o pega una imagen: se convierte en un personaje.'
card2_h = 'Una vida propia'
card2 = 'Caminar, deambular, rebotar, seguir al cursor o entre ellos, jugar a pillar — o un pequeño script que escribes tú.'
card3_h = 'A lo largo de tu día'
card3 = 'Recordatorios para descansar o beber agua, un temporizador de concentración, la hora de dormir y un «bienvenido de nuevo» cuando vuelves.'
card4_h = 'Sin estorbar'
card4 = 'Los clics los atraviesan. Se apartan para juegos y películas a pantalla completa, y se quedan quietos mientras no estás.'
card5_h = 'Escenas para compartir'
card5 = 'Guarda lo que hay en pantalla con un nombre, cambia según la hora del día y comparte una escena o un personaje en un solo archivo.'
card6_h = 'Ligero'
card6 = 'Casi nada de CPU mientras nada se mueve, treinta fotogramas por segundo si quieres, y en un portátil con Linux la GPU NVIDIA sigue dormida.'
card7_h = 'Para todos'
card7 = 'Diez idiomas, lectores de pantalla, cada acción desde el teclado, temas de alto contraste.'
card8_h = 'Privado por diseño'
card8 = 'No hace ninguna conexión de red. Nada sobre ti o tu escritorio sale de tu ordenador.'

look = 'Un vistazo'
trailer = 'Medio minuto, sin sonido: personajes que caminan y flotan por el escritorio; un toque al gato y al corazón, y cada uno saluda; la bienvenida, donde se ponen en el escritorio el conejito, la rana, la seta y la nube; el gato levantado, sostenido y soltado para que caiga.'
shot1_alt = 'Cinco personajes sobre un fondo de escritorio; el gato dice «Hi there!»'
shot1 = 'En el escritorio, los clics pasan a través'
