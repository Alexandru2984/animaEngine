p_title = 'Privacidad — animaEngine'
p_description = 'animaEngine no recopila nada: la aplicación no hace ninguna conexión de red.'
home = 'Inicio'
p_intro = '<strong>La aplicación no recopila nada.</strong> animaEngine no hace ninguna conexión de red de ningún tipo: ni telemetría, ni informes de fallos enviados, ni búsqueda de actualizaciones, ni cuentas, ni publicidad. Nada sobre ti, tu ordenador o lo que hay en tu pantalla sale de él.'
p_keeps = 'Lo que la aplicación guarda, en tu ordenador'
p_keeps1 = 'Sus ajustes y tus escenas, en la carpeta de configuración de tu usuario (<code>~/.config/animaengine</code> en Linux, <code>%APPDATA%\animaEngine</code> en Windows).'
p_keeps2 = 'Las imágenes que añades, en su biblioteca, y copias decodificadas de ellas en una carpeta de caché, para que carguen más rápido.'
p_keeps3 = 'Tras un fallo, una copia de la escena de justo antes, para <code>anima-engine --recover</code>.'
p_keeps_after = 'Todo se queda en tu ordenador, en las carpetas de tu usuario. Al desinstalar se conserva para una instalación posterior; borra esas carpetas para eliminarlo. Las <a href="https://github.com/Alexandru2984/animaEngine/blob/main/docs/faq.md#removing-it">preguntas frecuentes</a> dicen dónde están.'
p_report = 'El informe de diagnóstico'
p_report_text = 'Apariencia → Acerca de → <em>Copiar informe de diagnóstico</em> pone un texto breve en tu portapapeles: la versión de la aplicación, el nombre de tu sistema, tu tarjeta gráfica y sus últimas advertencias — nunca las rutas de tus archivos. La aplicación no lo envía a ningún sitio. Solo va adonde lo pegas.'
p_site = 'Este sitio'
p_site_text = 'Este sitio no usa cookies ni ejecuta análisis o scripts, y no carga nada de otros sitios. Lo sirve GitHub Pages, que, como cualquier servidor web, recibe tu dirección IP con cada petición; consulta la <a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement">declaración de privacidad de GitHub</a>. Las descargas vienen de las páginas de versiones de GitHub, bajo la misma declaración.'
p_contact = 'Contacto'
p_contact_text = 'Preguntas sobre privacidad: <a href="https://github.com/Alexandru2984/animaEngine/issues">abre una incidencia</a> o, para un problema de seguridad, sigue la <a href="https://github.com/Alexandru2984/animaEngine/blob/main/SECURITY.md">política de seguridad</a>.'
p_changed = 'Último cambio: 25 de octubre de 2026.'
