p_title = 'Confidentialité — animaEngine'
p_description = 'animaEngine ne collecte rien : l’application n’établit aucune connexion réseau.'
home = 'Accueil'
p_intro = '<strong>L’application ne collecte rien.</strong> animaEngine n’établit aucune connexion réseau, d’aucune sorte : ni télémétrie, ni rapports de plantage envoyés, ni vérification de mises à jour, ni comptes, ni publicité. Rien sur vous, votre ordinateur ou votre écran n’en sort.'
p_keeps = 'Ce que l’application garde, sur votre ordinateur'
p_keeps1 = 'Ses réglages et vos scènes, dans le dossier de configuration de votre utilisateur (<code>~/.config/animaengine</code> sous Linux, <code>%APPDATA%\animaEngine</code> sous Windows).'
p_keeps2 = 'Les images que vous ajoutez, dans sa bibliothèque, et des copies décodées dans un dossier de cache, pour qu’elles se chargent plus vite.'
p_keeps3 = 'Après un plantage, une copie de la scène d’avant, pour <code>anima-engine --recover</code>.'
p_keeps_after = 'Tout reste sur votre ordinateur, dans les dossiers de votre utilisateur. La désinstallation les laisse en place pour une installation future ; supprimez ces dossiers pour tout effacer. La <a href="https://github.com/Alexandru2984/animaEngine/blob/main/docs/faq.md#removing-it">FAQ</a> indique où ils se trouvent.'
p_report = 'Le rapport de diagnostic'
p_report_text = 'Apparence → À propos → <em>Copier le rapport de diagnostic</em> place un court texte dans votre presse-papiers : la version de l’application, le nom de votre système, votre carte graphique et ses derniers avertissements — jamais les chemins de vos fichiers. L’application ne l’envoie nulle part. Il ne va que là où vous le collez.'
p_site = 'Ce site'
p_site_text = 'Ce site ne dépose aucun cookie, n’exécute ni statistiques ni scripts et ne charge rien depuis d’autres sites. Il est servi par GitHub Pages, qui, comme tout serveur web, reçoit votre adresse IP à chaque requête ; voir la <a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement">déclaration de confidentialité de GitHub</a>. Les téléchargements viennent des pages de versions de GitHub, sous la même déclaration.'
p_contact = 'Contact'
p_contact_text = 'Questions sur la confidentialité : <a href="https://github.com/Alexandru2984/animaEngine/issues">ouvrez un ticket</a> ou, pour un problème de sécurité, suivez la <a href="https://github.com/Alexandru2984/animaEngine/blob/main/SECURITY.md">politique de sécurité</a>.'
p_changed = 'Dernière modification : 25 octobre 2026.'
