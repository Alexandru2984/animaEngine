h1 = 'Des personnages animés qui vivent sur votre bureau'
lead = 'Ils marchent, rebondissent, se suivent et jouent à chat par-dessus vos fenêtres — ou en dessous. Touchez-en un et il vous salue. Les clics passent directement à votre travail.'
view_source = 'Voir le code source'
demo_alt = 'Un personnage est touché et salue ; le mode édition s’ouvre, un personnage est sélectionné, et une image collée devient un nouveau personnage.'

features = 'Ce qu’il fait'
card1_h = 'Toute image prend vie'
card1 = 'Déposez un PNG, un GIF, un WebP ou un court MP4 sur l’écran, ou collez une image : elle devient un personnage.'
card2_h = 'Une vie à eux'
card2 = 'Marcher, flâner, rebondir, suivre le curseur ou les autres, jouer à chat — ou un petit script que vous écrivez.'
card3_h = 'Au fil de votre journée'
card3 = 'Des rappels pour faire une pause ou boire de l’eau, un minuteur de concentration, l’heure du coucher et un « bon retour » quand vous revenez.'
card4_h = 'Jamais dans vos pattes'
card4 = 'Les clics passent au travers. Ils s’écartent pour les jeux et les films en plein écran, et restent immobiles pendant votre absence.'
card5_h = 'Des scènes à partager'
card5 = 'Enregistrez ce qui est à l’écran sous un nom, changez selon l’heure, et partagez une scène ou un personnage en un seul fichier.'
card6_h = 'Léger'
card6 = 'Presque aucun processeur quand rien ne bouge, trente images par seconde si vous le souhaitez, et sur un portable Linux le GPU NVIDIA reste endormi.'
card7_h = 'Pour tout le monde'
card7 = 'Dix langues, lecteurs d’écran, chaque action au clavier, thèmes à contraste élevé.'
card8_h = 'Privé par conception'
card8 = 'Il n’établit aucune connexion réseau. Rien sur vous ou votre bureau ne quitte votre ordinateur.'

look = 'Un aperçu'
