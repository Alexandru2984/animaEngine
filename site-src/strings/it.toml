p_title = 'Privacy — animaEngine'
p_description = 'animaEngine non raccoglie nulla: l’app non fa alcuna connessione di rete.'
home = 'Home'
p_intro = '<strong>L’app non raccoglie nulla.</strong> animaEngine non fa nessun tipo di connessione di rete: niente telemetria, niente segnalazioni di crash inviate, niente controllo degli aggiornamenti, niente account, niente pubblicità. Niente su di te, sul tuo computer o su ciò che hai sullo schermo ne esce.'
p_keeps = 'Cosa conserva l’app, sul tuo computer'
p_keeps1 = 'Le sue impostazioni e le tue scene, nella cartella di configurazione del tuo utente (<code>~/.config/animaengine</code> su Linux, <code>%APPDATA%\animaEngine</code> su Windows).'
p_keeps2 = 'Le immagini che aggiungi, nella sua libreria, e copie decodificate in una cartella di cache, perché si carichino più in fretta.'
p_keeps3 = 'Dopo un crash, una copia della scena di poco prima, per <code>anima-engine --recover</code>.'
p_keeps_after = 'Tutto resta sul tuo computer, nelle cartelle del tuo utente. Disinstallando rimane al suo posto per un’installazione futura; elimina quelle cartelle per toglierlo. Le <a href="https://github.com/Alexandru2984/animaEngine/blob/main/docs/faq.md#removing-it">FAQ</a> dicono dove sono.'
p_report = 'Il rapporto diagnostico'
p_report_text = 'Aspetto → Informazioni → <em>Copia il rapporto diagnostico</em> mette un breve testo negli appunti: la versione dell’app, il nome del tuo sistema, la tua scheda grafica e gli ultimi avvisi dell’app — mai i percorsi dei tuoi file. L’app non lo invia da nessuna parte. Va solo dove lo incolli tu.'
p_site = 'Questo sito'
p_site_text = 'Questo sito non usa cookie, non esegue statistiche né script e non carica nulla da altri siti. È servito da GitHub Pages, che, come ogni server web, riceve il tuo indirizzo IP a ogni richiesta; vedi l’<a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement">informativa sulla privacy di GitHub</a>. I download arrivano dalle pagine delle versioni di GitHub, con la stessa informativa.'
p_contact = 'Contatti'
p_contact_text = 'Domande sulla privacy: <a href="https://github.com/Alexandru2984/animaEngine/issues">apri una segnalazione</a> oppure, per un problema di sicurezza, segui la <a href="https://github.com/Alexandru2984/animaEngine/blob/main/SECURITY.md">politica di sicurezza</a>.'
p_changed = 'Ultima modifica: 25 ottobre 2026.'
