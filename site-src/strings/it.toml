h1 = 'Personaggi animati che vivono sul tuo desktop'
lead = 'Camminano, rimbalzano, si seguono e giocano ad acchiapparella sopra le tue finestre — o sotto. Toccane uno e ti saluta. I clic passano dritti al tuo lavoro.'
view_source = 'Guarda il sorgente'
demo_alt = 'Un personaggio viene toccato e saluta; si apre la modalità modifica, un personaggio viene selezionato e un’immagine incollata diventa un nuovo personaggio.'

features = 'Cosa fa'
card1_h = 'Ogni immagine prende vita'
card1 = 'Trascina sullo schermo un PNG, una GIF, un WebP o un breve MP4, oppure incolla un’immagine: diventa un personaggio.'
card2_h = 'Una vita tutta loro'
card2 = 'Camminare, vagare, rimbalzare, seguire il cursore o gli altri, giocare ad acchiapparella — o un piccolo script scritto da te.'
card3_h = 'Lungo la tua giornata'
card3 = 'Promemoria per una pausa o per bere acqua, un timer di concentrazione, l’ora della nanna e un «bentornato» quando torni.'
card4_h = 'Mai d’intralcio'
card4 = 'I clic passano attraverso. Si fanno da parte per giochi e film a schermo intero, e restano fermi mentre sei via.'
card5_h = 'Scene da condividere'
card5 = 'Salva ciò che c’è sullo schermo con un nome, cambia a seconda dell’ora e condividi una scena o un personaggio in un solo file.'
card6_h = 'Leggero'
card6 = 'Quasi nessun uso della CPU quando niente si muove, trenta fotogrammi al secondo se vuoi, e su un portatile Linux la GPU NVIDIA resta addormentata.'
card7_h = 'Per tutti'
card7 = 'Dieci lingue, lettori di schermo, ogni azione dalla tastiera, temi ad alto contrasto.'
card8_h = 'Riservato per natura'
card8 = 'Non fa alcuna connessione di rete. Niente su di te o sul tuo desktop esce dal tuo computer.'

