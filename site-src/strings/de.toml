h1 = 'Animierte Figuren, die auf Ihrem Desktop leben'
lead = 'Sie laufen, hüpfen, folgen einander und spielen Fangen über Ihren Fenstern — oder darunter. Tippen Sie eine an, und sie grüßt. Klicks gehen direkt an Ihre Arbeit durch.'
view_source = 'Quellcode ansehen'
demo_alt = 'Eine Figur wird angetippt und grüßt; der Bearbeitungsmodus öffnet sich, eine Figur wird ausgewählt, und ein eingefügtes Bild wird zu einer neuen Figur.'

features = 'Was es kann'
card1_h = 'Jedes Bild wird lebendig'
card1 = 'Ziehen Sie ein PNG, GIF, WebP oder ein kurzes MP4 auf den Bildschirm oder fügen Sie ein Bild ein: Es wird zur Figur.'
card2_h = 'Ein eigenes Leben'
card2 = 'Laufen, umherstreifen, hüpfen, dem Mauszeiger oder einander folgen, Fangen spielen — oder ein kleines Skript, das Sie schreiben.'
card3_h = 'Durch Ihren Tag'
card3 = 'Erinnerungen an eine Pause oder ans Trinken, ein Fokus-Timer, Schlafenszeit und ein „Willkommen zurück“, wenn Sie wiederkommen.'
card4_h = 'Nie im Weg'
card4 = 'Klicks gehen hindurch. Bei Spielen und Filmen im Vollbild treten sie beiseite, und während Sie weg sind, halten sie still.'
card5_h = 'Szenen zum Teilen'
card5 = 'Speichern Sie, was auf dem Bildschirm ist, unter einem Namen, wechseln Sie je nach Tageszeit, und teilen Sie eine Szene oder eine Figur als eine Datei.'
card6_h = 'Leicht'
card6 = 'Kaum CPU, solange sich nichts bewegt, auf Wunsch dreißig Bilder pro Sekunde, und auf einem Linux-Laptop schläft die NVIDIA-GPU weiter.'
card7_h = 'Für alle'
card7 = 'Zehn Sprachen, Bildschirmleser, jede Aktion über die Tastatur, kontrastreiche Designs.'
card8_h = 'Privat von Grund auf'
card8 = 'Es baut überhaupt keine Netzwerkverbindung auf. Nichts über Sie oder Ihren Desktop verlässt Ihren Computer.'

look = 'Ein Blick'
trailer = 'Eine halbe Minute, ohne Ton: Figuren laufen und schweben über den Desktop; ein Tippen auf die Katze und auf das Herz, und jede grüßt; das Willkommen, in dem Häschen, Frosch, Pilz und Wolke auf den Desktop gesetzt werden; die Katze wird hochgehoben, gehalten und fallen gelassen.'
shot1_alt = 'Fünf Figuren über einem Desktop-Hintergrund; die Katze sagt „Hi there!“'
shot1 = 'Auf dem Desktop, Klicks gehen hindurch'
shot2_alt = 'Bearbeitungsmodus: die Katze ausgewählt, der Inspektor zeigt Position und Darstellung.'
shot2 = 'Bearbeitungsmodus: anordnen und ändern'
shot3_alt = 'Die Befehlspalette mit fertigen Szenen-Vorlagen.'
shot3 = 'Alles über die Tastatur'
shot4_alt = 'Der Tab „Darstellung“: Design, Sprache, Barrierefreiheit, Pausieren und Bildrate.'
shot4 = 'So, wie Sie arbeiten'

