p_title = 'Datenschutz — animaEngine'
p_description = 'animaEngine sammelt nichts: Die App baut keine Netzwerkverbindung auf.'
home = 'Startseite'
p_intro = '<strong>Die App sammelt nichts.</strong> animaEngine baut keinerlei Netzwerkverbindung auf: keine Telemetrie, keine Absturzberichte, keine Update-Prüfung, keine Konten, keine Werbung. Nichts über Sie, Ihren Computer oder Ihren Bildschirm verlässt ihn.'
p_keeps = 'Was die App auf Ihrem Computer aufbewahrt'
p_keeps1 = 'Ihre Einstellungen und Ihre Szenen, im Konfigurationsordner Ihres Benutzers (<code>~/.config/animaengine</code> unter Linux, <code>%APPDATA%\animaEngine</code> unter Windows).'
p_keeps2 = 'Die Bilder, die Sie hinzufügen, in ihrer Bibliothek, und dekodierte Kopien davon in einem Cache-Ordner, damit sie schneller laden.'
p_keeps3 = 'Nach einem Absturz eine Kopie der Szene von kurz davor, für <code>anima-engine --recover</code>.'
p_keeps_after = 'Alles bleibt auf Ihrem Computer, in den Ordnern Ihres Benutzers. Beim Deinstallieren bleibt es für eine spätere Installation erhalten; löschen Sie diese Ordner, um es zu entfernen. Die <a href="https://github.com/Alexandru2984/animaEngine/blob/main/docs/faq.md#removing-it">FAQ</a> sagt, wo sie liegen.'
p_report = 'Der Diagnosebericht'
p_report_text = 'Darstellung → Über → <em>Diagnosebericht kopieren</em> legt einen kurzen Text in die Zwischenablage: die Version der App, den Namen Ihres Systems, Ihre Grafikkarte und die letzten Warnungen der App — nie die Pfade Ihrer Dateien. Die App schickt ihn nirgendwohin. Er gelangt nur dorthin, wo Sie ihn einfügen.'
p_site = 'Diese Website'
p_site_text = 'Diese Website setzt keine Cookies, führt keine Analysen oder Skripte aus und lädt nichts von anderen Websites. Sie wird von GitHub Pages ausgeliefert, das wie jeder Webserver bei jeder Anfrage Ihre IP-Adresse erhält; siehe die <a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement">Datenschutzerklärung von GitHub</a>. Downloads kommen von den Release-Seiten von GitHub, unter derselben Erklärung.'
p_contact = 'Kontakt'
p_contact_text = 'Fragen zum Datenschutz: <a href="https://github.com/Alexandru2984/animaEngine/issues">Eröffnen Sie ein Issue</a> oder folgen Sie bei einem Sicherheitsproblem der <a href="https://github.com/Alexandru2984/animaEngine/blob/main/SECURITY.md">Sicherheitsrichtlinie</a>.'
p_changed = 'Zuletzt geändert: 25. Oktober 2026.'
