<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    Variant 2 — "Orbit"
  
    Reads as: "engine that moves things on a path"
    Mood:     abstract, technical, serious — for a product positioning
    Palette:  dark base from the design system, accent for the moving sprite
    Hook:     three particles on a path with motion trails. Speaks
              directly to the engine's job (animating entities along a
              trajectory) without leaning on cartoon language. Works
              equally well on dark and light desktops because the
              outer ring carries the silhouette.
  -->
  <title>animaEngine — Orbit</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E222B"/>
      <stop offset="1" stop-color="#262B36"/>
    </linearGradient>
    <radialGradient id="dotGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C8EFF" stop-opacity="1"/>
      <stop offset="1" stop-color="#7C8EFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded badge -->
  <rect width="256" height="256" rx="56" ry="56" fill="url(#bg)"/>

  <!-- Orbit ring (dashed, suggests a path the engine animates along) -->
  <circle cx="128" cy="128" r="78"
          fill="none"
          stroke="#7C8EFF"
          stroke-width="2"
          stroke-opacity="0.35"
          stroke-dasharray="6 8"/>

  <!-- Inner orbit (smaller, opposite phase) -->
  <circle cx="128" cy="128" r="44"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="1.5"
          stroke-opacity="0.18"
          stroke-dasharray="3 6"/>

  <!-- Motion trails (arcs leading into each dot) -->
  <path d="M 50 160 A 78 78 0 0 1 50 96"
        fill="none" stroke="#7C8EFF" stroke-width="6"
        stroke-linecap="round" stroke-opacity="0.55"/>
  <path d="M 206 96 A 78 78 0 0 1 206 160"
        fill="none" stroke="#5BCB7B" stroke-width="6"
        stroke-linecap="round" stroke-opacity="0.55"/>
  <path d="M 100 200 A 44 44 0 0 1 156 200"
        fill="none" stroke="#E8B23C" stroke-width="4"
        stroke-linecap="round" stroke-opacity="0.55"/>

  <!-- Three particle "sprites" on the orbits — distinct colours so
       the icon reads as a multi-entity scene even at 24×24 -->
  <circle cx="50"  cy="96"  r="20" fill="url(#dotGlow)" opacity="0.6"/>
  <circle cx="50"  cy="96"  r="11" fill="#7C8EFF"/>

  <circle cx="206" cy="160" r="20" fill="url(#dotGlow)" opacity="0.6"/>
  <circle cx="206" cy="160" r="11" fill="#5BCB7B"/>

  <circle cx="128" cy="172" r="20" fill="url(#dotGlow)" opacity="0.6"/>
  <circle cx="128" cy="172" r="11" fill="#E8B23C"/>

  <!-- Centre — implied "anchor" / origin point -->
  <circle cx="128" cy="128" r="3.5" fill="#FFFFFF" opacity="0.5"/>
</svg>
