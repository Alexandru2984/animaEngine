# Flathub submission manifest for animaEngine.
#
# Differences from the local-dev manifest (com.animaengine.Anima.yml):
#   - builds from the released git tag, not the working tree;
#   - every crate is pinned by hash in cargo-sources.json (Flathub
#     forbids network access during build), regenerate with:
#       python3 flatpak-cargo-generator.py Cargo.lock -o cargo-sources.json
#     from https://github.com/flatpak/flatpak-builder-tools/tree/master/cargo
#
# See FLATHUB.md for the submission checklist.

app-id: com.animaengine.Anima
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: anima-engine

finish-args:
  # X11 only. The app's default path draws through X11 (XWayland on a
  # Wayland session) for XShape click-through and always-on-top; its
  # native Wayland backend is an opt-in for wlroots compositors. The
  # previous `x11` + `wayland` + `fallback-x11` meant no X11 at all on a
  # Wayland session — fallback-x11 withdraws X11 whenever a Wayland
  # socket exists — and the app could not start on GNOME or KDE.
  - --share=ipc
  - --socket=x11
  # GPU for wgpu (Vulkan / OpenGL).
  - --device=dri
  # Sound for behavior scripts' play(): ALSA inside the runtime plays
  # through this socket. It is also the socket a recorder would use —
  # Flatpak has no playback-only permission — so the guarantee here is
  # the native one: no capture code is linked (docs/threat-model.md).
  - --socket=pulseaudio
  # System tray via StatusNotifierItem.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  # Single-instance handshake — we own the bus name matching our app-id.
  - --own-name=com.animaengine.Anima
  # Read-only access to the two usual sources of a dropped file. The
  # app's own config, cache and asset library need no grant: inside the
  # sandbox they live in ~/.var/app/com.animaengine.Anima/, which the
  # app always owns. Nothing else in home is reachable, so a decoder
  # exploit cannot read ~/.ssh, ~/.gnupg or browser profiles.
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-download:ro

modules:
  - name: anima-engine
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/anima-engine/cargo
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml
      - cargo --offline build --release --locked
      - install -Dm0755 target/release/anima_engine
            /app/bin/anima-engine
      - install -Dm0644 data/com.animaengine.Anima.desktop
            /app/share/applications/com.animaengine.Anima.desktop
      - install -Dm0644 data/anima-engine.svg
            /app/share/icons/hicolor/scalable/apps/com.animaengine.Anima.svg
      - install -Dm0644 data/com.animaengine.Anima.metainfo.xml
            /app/share/metainfo/com.animaengine.Anima.metainfo.xml
      # The .desktop ships Icon=anima-engine for the .deb / AppImage
      # paths; Flatpak export requires the icon name to equal the
      # app-id.
      - sed -i 's/^Icon=.*/Icon=com.animaengine.Anima/'
            /app/share/applications/com.animaengine.Anima.desktop
    sources:
      - type: git
        url: https://github.com/Alexandru2984/animaEngine.git
        tag: v1.3.0
        # Pin the tag's commit hash here at submission time (see
        # FLATHUB.md) — it isn't knowable before the release commit
        # itself lands.
      - cargo-sources.json
