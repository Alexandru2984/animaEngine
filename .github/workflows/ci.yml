name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly canary run: re-checks the advisory DBs against an unchanged
  # tree and runs the schedule-only jobs below (beta toolchain, Wayland
  # smoke, coverage) — upstream breakage gets caught the week it lands,
  # not the day we happen to push.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

# CI only reads the repo; keep the token read-only (least privilege).
permissions:
  contents: read

# Rapid-fire pushes supersede each other — cancel the stale run instead
# of paying for both. Scheduled runs get their own group (a weekly
# canary must never cancel a push run, or vice versa).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# NOTE: no global `RUSTFLAGS: -D warnings` — it would leak into every
# cargo invocation in every job, including `cargo install` of CI tools,
# where a warning in a tool's own dependency tree would fail *our*
# pipeline. Warnings-as-errors is enforced where it belongs: clippy
# (explicit -D) and rustdoc (RUSTDOCFLAGS on the doc job).
env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # actionlint is a Go tool — taiki-e/install-action can't provide
      # it (it fell through to cargo-binstall and failed: not a crate).
      # The official download script fetches a pinned release binary.
      # shellcheck is preinstalled on the runner, so actionlint's
      # shellcheck rules are active here — keep that in mind when a
      # local run (without shellcheck) comes up clean.
      - name: Install actionlint
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            -o /tmp/download-actionlint.bash
          bash /tmp/download-actionlint.bash 1.7.12 /tmp
      - run: /tmp/actionlint -color

  clippy:
    name: clippy
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Dropped ubuntu-22.04 in 0.2.0 — Swatinem/rust-cache was racing
        # against new transitive deps (ksni / zbus) and producing
        # spurious "can't find crate" errors. 24.04 is our LTS target
        # of record; the AppImage covers 22.04 users at runtime.
        os: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev libx11-dev libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libxrandr-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings

  doc:
    name: rustdoc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev libx11-dev libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libxrandr-dev
      - uses: Swatinem/rust-cache@v2
      # Broken intra-doc links and malformed doc comments fail the
      # build; private items are documented because the crate is a
      # binary — the docs are for contributors, not an API surface.
      - run: cargo doc --locked --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # See clippy job above for why 22.04 was dropped.
        os: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev libx11-dev libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libxrandr-dev
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # `--retries 1`: a test that fails once and passes on retry is
      # reported as FLAKY *by name* instead of failing the run — this
      # is the flake-naming harness pre-registered in
      # docs/plans/v0.9-freeze.md §W.2 (an intermittent single-test
      # failure surfaced ~3× during 0.6/0.7 and was never identified).
      # A test that fails twice still fails the job.
      - run: cargo nextest run --locked --all-targets --retries 1 --no-fail-fast
      # nextest does not run doctests; keep them covered separately.
      - run: cargo test --locked --doc
      # Benches must keep compiling (they're not in --all-targets'
      # bench-harness set since [lib]/[bin] disable it); execution
      # happens in the scheduled bench job below.
      - run: cargo bench --no-run --locked

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          # Keep in sync with `rust-version` in Cargo.toml. Derived
          # from the strictest requirement in Cargo.lock (image 0.25.10)
          # and verified with a full `cargo check --all-targets`.
          toolchain: '1.88'
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev libx11-dev libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libxrandr-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  machete:
    name: unused dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      # Source-scan only (no compilation): a direct dependency that no
      # `use`/path reaches fails the job. False positives go in
      # `[package.metadata.cargo-machete] ignored` with a comment.
      - run: cargo machete

  metadata:
    name: desktop metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The same validators `make validate` runs locally — but here
      # the tools are installed, so "skip" can't hide a regression.
      # The .desktop ↔ metainfo <id> match is what GNOME Shell keys
      # icon resolution on (broke silently before 0.3.2).
      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils appstream
      - run: desktop-file-validate data/com.animaengine.Anima.desktop
      - run: appstreamcli validate --no-net data/com.animaengine.Anima.metainfo.xml

  build:
    name: release build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev libx11-dev libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libxrandr-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      # Hand the binary to the smoke jobs — they exercise *this*
      # artifact instead of paying for a second (debug) build.
      - uses: actions/upload-artifact@v4
        with:
          name: release-binary
          path: target/release/anima_engine
          retention-days: 1

  smoke:
    name: smoke test (Xvfb)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Runtime-only job: no Rust toolchain. The dev packages below
      # pull in the runtime libraries the release binary links against
      # (plus the ones dlopen'd at runtime, see Cargo.toml deb notes).
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan1 mesa-vulkan-drivers libgl1 libx11-6 libxcb1 \
            libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 \
            libxrandr2 xvfb dbus dbus-daemon
      - uses: actions/download-artifact@v4
        with:
          name: release-binary
      - run: chmod +x anima_engine
      # dbus-run-session provides a real session bus, so the D-Bus
      # paths (single-instance name ownership, tray probe, portal
      # probe) execute instead of short-circuiting on "no bus".
      - name: Run release binary under Xvfb + session bus for 5 seconds
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 2
          timeout --preserve-status 5s \
            dbus-run-session -- ./anima_engine || EXIT=$?
          # 124 = timeout fired (expected); 0 = clean exit; anything else = failure
          if [ "${EXIT:-0}" != "0" ] && [ "${EXIT:-0}" != "124" ] && [ "${EXIT:-0}" != "143" ]; then
            echo "App exited with non-success/non-timeout code: $EXIT"
            exit 1
          fi
          echo "Smoke test passed."

  # ── Supply-chain checks ─────────────────────────────────────────────
  # Both jobs run against the committed Cargo.lock and gate the build.
  # A new RustSec advisory or a license drift in a transitive dep breaks
  # the next push; the fix is either bumping the dep, replacing it, or
  # adding an explicit ignore with a comment that explains why. See
  # docs/threat-model.md §"Supply chain" for the policy and the current
  # exception list lives in `deny.toml` (advisories.ignore).

  audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      # Known-ignored advisories:
      #   RUSTSEC-2024-0436 — `paste` unmaintained. Pulled in transitively
      #   via wgpu-hal's macOS metal backend and accesskit_winit's Windows
      #   AT bridge; neither path runs on our Linux X11/Wayland targets,
      #   so there's no runtime exposure. Revisit when wgpu / accesskit
      #   drop the dependency upstream.
      - run: cargo audit --deny warnings --ignore RUSTSEC-2024-0436

  deny:
    name: cargo deny check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - run: cargo deny check

  # ── Weekly canaries (schedule / manual only) ────────────────────────
  # Early-warning jobs: they surface upstream or platform drift as a
  # red scheduled run, and never block a push or a PR.

  beta:
    name: beta toolchain canary
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@beta
        with:
          components: clippy
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev libx11-dev libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libxrandr-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo nextest run --locked --all-targets --retries 1 --no-fail-fast

  smoke-wayland:
    name: smoke test (headless Weston)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan1 mesa-vulkan-drivers libgl1 libxkbcommon0 \
            libxkbcommon-x11-0 libwayland-client0 \
            weston dbus dbus-daemon
      - uses: actions/download-artifact@v4
        with:
          name: release-binary
      - run: chmod +x anima_engine
      # Weston implements no wlr-layer-shell, so this exercises the
      # documented fallback chain on a pure-Wayland session (no X):
      # compositor probe → no layer-shell → winit Wayland toplevel.
      # That path is field-unvalidated since 0.6 (see the 0.6.0 release
      # notes "Known limitations") — this canary is the first automated
      # environment that runs it at all.
      - name: Run release binary under headless Weston for 5 seconds
        run: |
          export XDG_RUNTIME_DIR=/tmp/xdg-runtime
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket=wayland-ci --idle-time=0 &
          sleep 3
          export WAYLAND_DISPLAY=wayland-ci
          unset DISPLAY
          timeout --preserve-status 5s \
            dbus-run-session -- ./anima_engine || EXIT=$?
          if [ "${EXIT:-0}" != "0" ] && [ "${EXIT:-0}" != "124" ] && [ "${EXIT:-0}" != "143" ]; then
            echo "App exited with non-success/non-timeout code: $EXIT"
            exit 1
          fi
          echo "Wayland smoke test passed."

  bench:
    name: benchmark canary
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev libx11-dev libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libxrandr-dev
      - uses: Swatinem/rust-cache@v2
      # Shared-runner numbers are too noisy to gate on; the value is
      # the trend. criterion keeps its history in target/criterion —
      # archived weekly so a regression has a paper trail.
      - run: cargo bench --locked -- --quick 2>&1 | tee bench-output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            bench-output.txt
            target/criterion
          retention-days: 90

  soak:
    name: memory soak (Xvfb)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev libx11-dev libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libxrandr-dev \
            xvfb mesa-vulkan-drivers dbus dbus-daemon
      - uses: Swatinem/rust-cache@v2
      # 10-minute soak with 20 s sampling (~30 points) — long enough to
      # regress RSS, short enough for a nightly shared runner. The
      # 30-minute and 7-day protocols are manual (docs/soak-testing.md).
      # Software GL/Vulkan via llvmpipe; no real GPU on the runner.
      - name: Soak
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: dbus-run-session -- scripts/soak.sh 600 20 1024
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-report
          path: |
            build/soak-report-*.md
            build/soak-*.csv
          retention-days: 30

  fuzz:
    name: fuzz smoke (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
      # The fuzz package depends on the full crate, so it needs the same
      # GPU/X system libs the build job installs.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev libx11-dev libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libxrandr-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install --locked cargo-fuzz
      # Seed each corpus from the committed seeds so the fuzzer starts
      # from valid inputs instead of empty.
      - name: Seed corpora
        run: |
          for t in cache_deserialize avcc_nalu_walk shimeji_xml \
                   keychord_parse uri_list_parse asset_type_detect; do
            mkdir -p "fuzz/corpus/$t"
            if [ -d "fuzz/seeds/$t" ]; then cp fuzz/seeds/$t/* "fuzz/corpus/$t/"; fi
          done
      # 60 s per target; a panic or sanitizer hit fails the job and the
      # reproducer is uploaded below.
      - name: Fuzz each target
        run: |
          for t in cache_deserialize avcc_nalu_walk shimeji_xml \
                   keychord_parse uri_list_parse asset_type_detect; do
            echo "::group::fuzz $t"
            cargo +nightly fuzz run "$t" -- -max_total_time=60
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          retention-days: 30

  coverage:
    name: coverage (lcov artifact)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev libx11-dev libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libxrandr-dev
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: cargo llvm-cov nextest --locked --all-targets --lcov --output-path lcov.info
      # No external coverage service — the lcov file is the artifact;
      # inspect locally with `genhtml` or an editor extension.
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 30
