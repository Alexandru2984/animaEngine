name: Release

# Tag-triggered release pipeline. Pushing a `vX.Y.Z` tag builds the
# .deb + AppImage with embedded SBOMs (cargo auditable) in an
# **unprivileged** job, then a separate **publish** job attests build
# provenance for both and opens a **draft** GitHub release with the
# artifacts attached and the notes from docs/release-notes/. A human
# reviews the draft and clicks publish — nothing goes public on its own.
#
# Why two jobs: the build downloads and runs `linuxdeploy` (content-
# pinned by SHA-256, but still third-party code) with the workspace open.
# Keeping the signing token (id-token) and release-write permission out of
# that job means a compromised build tool can't misuse the credentials or
# certify a malicious artifact — it can only produce an artifact the
# publish job then attests. The publish job runs no third-party code.
#
# Guards (in build): the tag must be an ancestor of origin/main, match
# Cargo.toml's version, have a notes file, and the full test suite must
# pass on the tagged commit.

on:
  push:
    tags: ['v*']

# Minimal default for every job. Only `publish` is granted the elevated
# permissions below.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # linuxdeploy is itself an AppImage; runners have no FUSE, so let it
  # self-extract instead.
  APPIMAGE_EXTRACT_AND_RUN: '1'

jobs:
  build:
    name: build (unprivileged)
    # Build on the OLDEST supported LTS, not `ubuntu-latest`. Both
    # artifacts link the runner's glibc, and an AppImage/.deb only runs
    # on a glibc **at least as new** as the build machine's. 22.04 ships
    # glibc 2.35 — the floor that covers every distro we promise
    # (Debian 12, Fedora, Arch, Ubuntu 22.04+). Building on 24.04
    # (glibc 2.39) silently breaks launch on all of them, which is
    # exactly what scripts/build-appimage.sh and
    # packaging/Dockerfile.appimage-builder (FROM ubuntu:22.04) warn
    # about. Do not "modernise" this to 24.04.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Full history so the "tag is on main" guard can run merge-base.
          fetch-depth: 0

      - name: Guard — tagged commit is contained in origin/main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not an ancestor of origin/main." >&2
            echo "Refusing to build a release from a commit that isn't on main." >&2
            exit 1
          fi

      - name: Guard — tag matches Cargo.toml, notes exist
        run: |
          VER="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$GITHUB_REF_NAME" != "v$VER" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version v$VER" >&2
            exit 1
          fi
          if [ ! -f "docs/release-notes/$GITHUB_REF_NAME.md" ]; then
            echo "Missing docs/release-notes/$GITHUB_REF_NAME.md — write the notes before tagging" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev libx11-dev libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libxrandr-dev \
            librsvg2-bin desktop-file-utils file

      # Deliberately no build cache on the release path: artifacts are
      # produced by a from-scratch build of exactly the tagged tree.
      # Pinned versions: a release must not silently pick up a newer (or
      # compromised) build tool between tags. `--locked` pins each tool's
      # own dependency tree; the `@version` pins the tool itself.
      - name: Install packaging tools
        run: cargo install --locked cargo-deb@3.7.0 cargo-auditable@0.7.5

      - uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2
        with:
          tool: cargo-nextest@0.9.143
      - name: Test gate on the tagged commit
        run: cargo nextest run --locked --all-targets --retries 1 --no-fail-fast

      # Both scripts detect cargo-auditable and embed the SBOM; the
      # second invocation reuses the first build via the cargo cache.
      - name: Build .deb
        run: scripts/build-deb.sh
      - name: Build AppImage
        run: scripts/build-appimage.sh

      # GitHub replaces `~` in release-asset filenames with `.` on
      # upload, but cargo-deb correctly names pre-release debs with a
      # tilde (`1.0.0~rc1-1`, which apt sorts before 1.0.0). Left
      # as-is, SHA256SUMS records the tilde name while the published
      # asset carries the dot name, so `sha256sum -c` fails for anyone
      # verifying a download. Rename BEFORE checksumming so the sums file
      # matches what GitHub serves; the tilde stays inside the .deb
      # metadata where apt ordering needs it.
      - name: Rename artifacts to GitHub-safe names
        run: |
          shopt -s nullglob
          for f in build/*~*; do
            mv -v "$f" "${f//\~/.}"
          done

      - name: Checksums
        run: |
          cd build
          sha256sum anima-engine_*.deb animaEngine-*.AppImage \
            > "SHA256SUMS-$GITHUB_REF_NAME.txt"
          cat "SHA256SUMS-$GITHUB_REF_NAME.txt"

      # Stage exactly the three release files into a clean dir so the
      # artifact hand-off carries them (and nothing from build/'s AppDir /
      # tools cruft) at a predictable path for the publish job.
      - name: Stage release artifacts
        run: |
          mkdir -p dist
          cp build/anima-engine_*.deb \
             build/animaEngine-*.AppImage \
             "build/SHA256SUMS-$GITHUB_REF_NAME.txt" \
             dist/
          ls -l dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  publish:
    name: attest + draft
    needs: build
    runs-on: ubuntu-22.04
    # The only job with elevated permissions — and it runs no third-party
    # code, just downloads the built artifacts, attests them, and opens
    # the draft release.
    permissions:
      contents: write # create the draft release + upload assets
      id-token: write # Sigstore OIDC for build provenance
      attestations: write
    steps:
      # Needed for the release-notes file (title + body). No history.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist

      # Provenance: cryptographically links each artifact to this workflow
      # run, repo and commit. Verify with:
      #   gh attestation verify <file> --repo <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/anima-engine_*.deb
            dist/animaEngine-*.AppImage

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/release-notes/$GITHUB_REF_NAME.md"
          TITLE="$(head -1 "$NOTES" | sed 's/^# *//')"
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "$TITLE" \
            --notes-file "$NOTES" \
            dist/anima-engine_*.deb \
            dist/animaEngine-*.AppImage \
            "dist/SHA256SUMS-$GITHUB_REF_NAME.txt"
          echo "Draft release created — review and publish from the Releases page."
