<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- The soak's private session bus (scripts/soak.sh). Deliberately no
     <servicedir>: with the stock session config, the soaked app's portal
     probe auto-starts xdg-desktop-portal and its desktop backend on this
     bus, which then try to reach the machine's real session. -->
<busconfig>
  <type>session</type>
  <listen>unix:tmpdir=/tmp</listen>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
