[package]
name = "anima_engine"
version = "0.1.0"
edition = "2021"
description = "Linux-first animated desktop overlay engine — render multiple animated characters over your desktop"
license = "MIT"
resolver = "2"

[dependencies]
# Windowing
winit = { version = "0.30", features = ["x11", "wayland"] }

# X11 input shape & global hotkey support
# Dock-type windows don't receive keyboard focus, so we need direct X11 control
x11rb = { version = "0.13", features = ["shape"] }
raw-window-handle = "0.6"

# GPU rendering
wgpu = "24"
bytemuck = { version = "1", features = ["derive"] }

# Image loading
image = { version = "0.25", default-features = false, features = ["png", "gif", "webp", "jpeg"] }

# Parallel iteration (PNG sequence decoding)
rayon = "1"

# Config
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
thiserror = "1"

# Async for wgpu
pollster = "0.4"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
