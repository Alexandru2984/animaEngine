[package]
name = "anima_engine"
version = "0.4.0"
edition = "2021"
description = "Linux-first animated desktop overlay engine — render multiple animated characters over your desktop"
license = "MIT"
resolver = "2"
homepage = "https://github.com/Alexandru2984/animaEngine"
repository = "https://github.com/Alexandru2984/animaEngine"
readme = "README.md"

# ── cargo-deb (used by `make deb` in 8.3) ────────────────────────────
# The release binary is renamed to `anima-engine` in /usr/bin and the
# .desktop / icon / metainfo files land at the freedesktop XDG paths.
[package.metadata.deb]
maintainer = "animaEngine contributors"
copyright = "2026, animaEngine contributors"
license-file = ["LICENSE", "0"]
extended-description = """\
Render multiple animated characters or sprites on top of your desktop
using transparent, always-on-top windows with GPU acceleration. Written
in Rust on wgpu + winit — no Electron, no Chromium, minimal RAM use.
Click-through by default; drag-and-drop PNG / GIF / WebP / JPEG / MP4
to add new characters; tray icon and global hotkeys included."""
section = "graphics"
priority = "optional"
# `$auto` reads NEEDED tags from the ELF; libxkbcommon-x11 is opened via
# dlopen by accesskit_unix at runtime, so it isn't in NEEDED and we list
# it explicitly. libgl1 + libvulkan1 cover the GPU side.
depends = "$auto, libgl1, libvulkan1, libxkbcommon-x11-0"
assets = [
    ["target/release/anima_engine", "usr/bin/anima-engine", "755"],
    # .desktop filename MUST match the AppStream <id> in the metainfo
    # file (com.animaengine.Anima). GNOME Shell 47+ on Ubuntu uses the
    # match as a key for icon resolution in the launcher / dock — a
    # mismatch silently falls back to a no-icon placeholder even when
    # theme lookup finds the PNG. (Fixed in 0.3.2.)
    ["data/com.animaengine.Anima.desktop", "usr/share/applications/", "644"],
    # SVG for scalable rendering + pre-rasterized PNGs at the seven
    # discrete sizes every freedesktop-spec icon resolver looks up
    # (Yaru / Adwaita / Breeze / Papirus all walk hicolor/<N>x<N>/
    # before falling back to scalable/). The PNGs are produced by
    # scripts/render-icons.sh on each `make deb`; if you build the
    # .deb manually with cargo-deb, run that script first.
    ["data/anima-engine.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["build/icons/16/anima-engine.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["build/icons/24/anima-engine.png", "usr/share/icons/hicolor/24x24/apps/", "644"],
    ["build/icons/32/anima-engine.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["build/icons/48/anima-engine.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["build/icons/64/anima-engine.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["build/icons/128/anima-engine.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["build/icons/256/anima-engine.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["data/com.animaengine.Anima.metainfo.xml", "usr/share/metainfo/", "644"],
    ["README.md", "usr/share/doc/anima-engine/", "644"],
]

[dependencies]
# Windowing
winit = { version = "0.30", features = ["x11", "wayland"] }

# X11 input shape & global hotkey support
# Dock-type windows don't receive keyboard focus, so we need direct X11 control
x11rb = { version = "0.13", features = ["shape"] }
raw-window-handle = "0.6"

# GPU rendering
wgpu = "24"
bytemuck = { version = "1", features = ["derive"] }

# Immediate-mode UI (settings panel, context menus)
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = { version = "0.31", default-features = false, features = ["wayland", "x11", "links", "accesskit"] }

# System tray via the freedesktop StatusNotifierItem D-Bus protocol.
# `ksni` is a pure-Rust implementation — zero system deps beyond an
# already-running D-Bus session (every Linux desktop has one). The
# `async-io` runtime keeps total compile cost an order of magnitude
# lower than the alternative tokio default.
ksni = { version = "0.3", default-features = false, features = ["async-io"] }
async-io = "2"

# Global hotkeys (XGrabKey on X11; XWayland inherits) — toggle edit mode
# and visibility without focusing the overlay.
global-hotkey = "0.8"

# Already pulled in transitively by ksni; pin explicitly so the
# single-instance D-Bus handshake doesn't break on minor bumps.
zbus = { version = "5", default-features = false, features = ["async-io"] }

# Native Wayland — used in addition to winit, not as a replacement.
# winit covers X11/XWayland (95 % of Linux desktops); sctk + wlr-layer-shell
# adds true overlay support on wlroots compositors (sway, Hyprland, river).
# The compositor probe at startup picks which backend is actually used.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# High-level Wayland client conveniences (registry, output, compositor,
# layer-shell handlers + the calloop event loop they integrate with).
# `xkbcommon` is intentionally disabled — it requires libxkbcommon-dev as
# a system dep, which we don't want to force on users. Keyboard handling
# on the native Wayland path is built directly on top of `wl_keyboard`.
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop"] }
calloop = "0.13"
calloop-wayland-source = "0.3"

# Image loading
image = { version = "0.25", default-features = false, features = ["png", "gif", "webp", "jpeg"] }

# Parallel iteration (PNG sequence decoding)
rayon = "1"

# Video — pure Rust MP4 demuxing + H.264 decoder (audio is ignored).
# `openh264` defaults to `source` feature which builds the C library
# from source, so no system dependency is required.
mp4 = "0.14"
openh264 = "0.9"

# Config
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
thiserror = "1"

# Async for wgpu
pollster = "0.4"
egui-phosphor = "0.9"
fluent = "0.17.0"
unic-langid = "0.9.6"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
